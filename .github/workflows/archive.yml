name: Archive MND bulletins

on:
  schedule:
    # 台灣時間 13:40、21:40（國防部通常 09:00 前後發布，晚發布的日子由第二班補）
    - cron: '40 5 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive new bulletins
        run: python scripts/archive.py --pages 5
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mnd/
          if git diff --cached --quiet; then echo 'nothing new'; exit 0; fi
          git commit -m "archive: $(date -u +%Y-%m-%d)"
          git push
